# Local guardrails, NOT an account-specific entitlement. Verify limits in AI Studio.
model: gemini-3.5-flash-lite
approved_free_models: [gemini-3.5-flash-lite]
thinking_level: minimal
max_input_tokens_equivalent: 16000
max_output_tokens: 2048
timeout_seconds: 45
retries: 0
# User-reported AI Studio: 15 RPM / 250,000 TPM / 500 RPD (2026-10-17).
# Conservative internal caps only. Free-tier/billing verification is still required.
# No permission to activate real calls, real data or scheduled execution.
daily_request_limit: 8
monthly_request_limit: 200
max_requests_per_run: 1
max_response_bytes: 32768
# Standard paid-equivalent estimate ONLY; this is not a bill or proof of free-tier status.
# https://ai.google.dev/gemini-api/docs/pricing (verified 2026-10-16)
input_usd_per_million: '0.30'
output_usd_per_million: '2.50'
