name: Phase 5 manual healthcheck
on:
  workflow_dispatch:
    inputs:
      account:
        type: string
        default: test-phase5-manual
        required: true
permissions:
  contents: read
jobs:
  health:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv python install 3.12
      - run: uv sync --locked
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ACCOUNT: ${{ inputs.account }}
        run: uv run python scripts/paper_cycle.py --mode health --account "$ACCOUNT"
      - name: Read-only synthetic fixture balance audit
        if: startsWith(inputs.account, 'test-phase5-fixture-')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ACCOUNT: ${{ inputs.account }}
        run: uv run trading-bot db status --backend supabase --account "$ACCOUNT" --test-account
