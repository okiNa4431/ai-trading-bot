name: Alpaca offline integration (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pytest tests/test_alpaca.py -v
      - name: Mock HTTP only; no secrets or real market observations
        run: uv run python scripts/alpaca_mock_probe.py > alpaca-mock-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: alpaca-mock-report
          path: alpaca-mock-report.json
          retention-days: 7
