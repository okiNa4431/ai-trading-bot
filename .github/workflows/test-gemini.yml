name: Test Gemini decision
on:
  workflow_dispatch:
    inputs:
      market:
        type: choice
        options: [JP, US]
        default: JP
        required: true
      mode:
        type: choice
        options: [mock, gemini]
        default: mock
        required: true
permissions:
  contents: read
concurrency:
  group: gemini-smoke
  cancel-in-progress: false
jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Mock decision (no Secret)
        if: inputs.mode == 'mock'
        env:
          MARKET: ${{ inputs.market }}
        run: uv run python scripts/test_gemini.py --market "$MARKET" --mode mock
      - name: Real Gemini decision (one request, dry-run only)
        if: inputs.mode == 'gemini'
        env:
          MARKET: ${{ inputs.market }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python scripts/test_gemini.py --market "$MARKET" --mode gemini
