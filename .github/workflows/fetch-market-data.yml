name: Fetch market data
on:
  workflow_dispatch:
    inputs:
      market:
        type: choice
        options: [ALL, JP, US]
        default: ALL
        required: true
      interval:
        type: choice
        options: [1d, 1h]
        default: 1d
        required: true
permissions:
  contents: read
concurrency:
  group: fetch-market-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Real-market collection paused pending provider rights
        run: uv run python -c "from trading_bot.data_access import require_live_market_access; require_live_market_access()"
      - name: Fetch and validate
        env:
          MARKET: ${{ inputs.market }}
          INTERVAL: ${{ inputs.interval }}
        shell: bash
        run: |
          set -o pipefail
          uv run trading-bot fetch --market "$MARKET" --interval "$INTERVAL" 2>&1 | tee fetch.log
      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '### Market data results' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f fetch.log ]; then tail -60 fetch.log >> "$GITHUB_STEP_SUMMARY"; fi
          uv run trading-bot status >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Access-state metadata only
        if: always()
        run: echo '{"real_market_access":"DISABLED","source_data_included":false}' > access-state.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: access-state
          path: access-state.json
          retention-days: 3
