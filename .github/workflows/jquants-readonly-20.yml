name: JP-2 J-Quants Free read-only 20 (manual)
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Separate owner execution approval required: READ_ONLY_JQUANTS_20_NO_STORAGE'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: jquants-readonly-main
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: jquants-research
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
          enable-cache: false
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Approved transient GET-only probe; aggregate output only
        run: uv run python scripts/jquants_readonly.py
        env:
          JQUANTS_RESEARCH_ENVIRONMENT: jquants-research
          JQUANTS_PLAN: ${{ vars.JQUANTS_PLAN }}
          JQUANTS_TERMS_CONFIRMED: ${{ vars.JQUANTS_TERMS_CONFIRMED }}
          JQUANTS_MARKET_DATA_LIVE_ENABLED: ${{ vars.JQUANTS_MARKET_DATA_LIVE_ENABLED }}
          JQUANTS_READONLY_APPROVAL: ${{ inputs.approval }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
# No market-data artifact/cache/DB, external AI, EDINET, broker, or scheduled execution.
