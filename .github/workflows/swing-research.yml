name: Synthetic swing research (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Synthetic data only, new offline accounts, no API credentials
        run: uv run python scripts/swing_research.py --output data/swing-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-swing-report
          path: data/swing-${{ github.run_id }}-${{ github.run_attempt }}/report.*
          retention-days: 7
