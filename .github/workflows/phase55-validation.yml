name: Phase 5.5 manual preparation and audit
on:
  workflow_dispatch:
    inputs:
      market:
        type: choice
        options: [JP, US]
        default: JP
        required: true
      mode:
        type: choice
        options: [prepare, audit, calendar, hold]
        default: audit
permissions:
  contents: read
concurrency:
  group: phase5-test-writer
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Preparation is not a completed real-market cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODE: ${{ inputs.mode }}
          MARKET: ${{ inputs.market }}
        run: uv run python scripts/phase55.py --mode "$MODE" --market "$MARKET"
